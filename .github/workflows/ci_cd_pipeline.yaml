name: CI/CD Pipeline

# Light and fast: formatting and syntax only. The training pipeline itself needs
# MLflow, W&B and PostgreSQL and is run locally (see the README).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install tools
        run: python -m pip install --upgrade pip black flake8

      - name: Syntax check (warnings are errors, so deprecated escapes are caught)
        run: python -W error -m compileall -f -q src sweeps

      - name: Lint with Flake8 (Non-blocking)
        run: flake8 . --max-line-length 120 || true

      - name: Format Check with Black
        run: black --check .

      - name: Run Tests (if available)
        run: |
          if [ -d "tests" ]; then pip install pytest && pytest tests/; fi
